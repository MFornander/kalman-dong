<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>One Strand folded into four Lines</title>
  <desc>Data enters Line 0 at the Hilt and runs up to the tip, folds down Line 1, folds at the Hilt up Line 2, folds at the tip down Line 3 and ends at the Hilt. 5 V is fed at both ends of every Line.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="398" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>

  <g fill="#5F5E5A" font-size="13">
    <text x="30" y="84">Tip</text>
    <text x="30" y="300">Hilt</text>
  </g>

  <!-- Lines -->
  <g fill="#E1F5EE" stroke="#0F6E56">
    <rect x="140" y="70" width="34" height="230" rx="6"/>
    <rect x="240" y="70" width="34" height="230" rx="6"/>
    <rect x="340" y="70" width="34" height="230" rx="6"/>
    <rect x="440" y="70" width="34" height="230" rx="6"/>
  </g>
  <g stroke="#0F6E56" stroke-width="2" fill="none">
    <line x1="157" y1="270" x2="157" y2="104" marker-end="url(#a)"/>
    <line x1="257" y1="100" x2="257" y2="266" marker-end="url(#a)"/>
    <line x1="357" y1="270" x2="357" y2="104" marker-end="url(#a)"/>
    <line x1="457" y1="100" x2="457" y2="266" marker-end="url(#a)"/>
    <path d="M157 70 V48 H257 V70"/>
    <path d="M357 70 V48 H457 V70"/>
    <path d="M257 300 V322 H357 V300"/>
    <line x1="157" y1="352" x2="157" y2="304" marker-end="url(#a)"/>
  </g>
  <g fill="#085041" font-size="13" text-anchor="middle">
    <text x="157" y="372">DATA, CLOCK in</text>
    <text x="457" y="322">end</text>
  </g>
  <g fill="#0F6E56" font-size="12" text-anchor="middle">
    <text x="207" y="40">fold</text>
    <text x="407" y="40">fold</text>
    <text x="307" y="340">fold</text>
  </g>
  <g fill="#085041" font-size="13" font-weight="600" text-anchor="middle">
    <text x="157" y="190" transform="rotate(-90 157 190)" dy="-22">Line 0</text>
    <text x="257" y="190" transform="rotate(-90 257 190)" dy="-22">Line 1</text>
    <text x="357" y="190" transform="rotate(-90 357 190)" dy="-22">Line 2</text>
    <text x="457" y="190" transform="rotate(-90 457 190)" dy="-22">Line 3</text>
  </g>

  <!-- 5 V feeds -->
  <g fill="#EF9F27" stroke="#854F0B">
    <circle cx="186" cy="76" r="5"/><circle cx="186" cy="294" r="5"/>
    <circle cx="286" cy="76" r="5"/><circle cx="286" cy="294" r="5"/>
    <circle cx="386" cy="76" r="5"/><circle cx="386" cy="294" r="5"/>
    <circle cx="486" cy="76" r="5"/><circle cx="486" cy="294" r="5"/>
    <circle cx="516" cy="372" r="5"/>
  </g>
  <text x="528" y="376" fill="#633806" font-size="12">5 V feed</text>
</svg>
