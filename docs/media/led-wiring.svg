<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 430" width="770" height="430" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Dong LED wiring</title>
  <desc>Battery through a fuse feeds 5 V to both ends of every Line and, through a Schottky diode, the board's VBUS pad. GPIO38 and GPIO39 go through a 74AHCT125 level shifter and 33 ohm resistors into the Strand's data and clock at the Hilt end of Line 0. Everything shares one ground.</desc>
  <defs>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="1" y="1" width="768" height="428" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>

  <!-- Power path -->
  <g fill="#FAEEDA" stroke="#BA7517">
    <rect x="20" y="36" width="190" height="56" rx="8"/>
    <rect x="230" y="36" width="110" height="56" rx="8"/>
    <rect x="530" y="36" width="210" height="56" rx="8"/>
    <rect x="360" y="126" width="140" height="56" rx="8"/>
  </g>
  <g fill="#633806" font-size="14" text-anchor="middle">
    <text x="115" y="60" font-weight="600">Battery, 5 V</text>
    <text x="285" y="60" font-weight="600">Fuse</text>
    <text x="635" y="60" font-weight="600">Pixel power</text>
    <text x="430" y="150" font-weight="600">Schottky diode</text>
  </g>
  <g fill="#854F0B" font-size="12" text-anchor="middle">
    <text x="115" y="79">rated at least the Power Budget</text>
    <text x="285" y="79">1.5 × budget</text>
    <text x="635" y="79">both ends of every Line</text>
    <text x="430" y="169">SS34, 3 A</text>
  </g>
  <g stroke="#BA7517" stroke-width="2" fill="none">
    <line x1="210" y1="64" x2="226" y2="64" marker-end="url(#ap)"/>
    <line x1="340" y1="64" x2="526" y2="64" marker-end="url(#ap)"/>
    <line x1="430" y1="64" x2="430" y2="122" marker-end="url(#ap)"/>
    <path d="M430 182 V258 H236" marker-end="url(#ap)"/>
  </g>
  <circle cx="430" cy="64" r="4" fill="#BA7517"/>

  <!-- Board -->
  <rect x="30" y="206" width="200" height="132" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="130" y="228" fill="#3C3489" font-size="14" font-weight="600" text-anchor="middle">XIAO ESP32-S3 Plus</text>
  <g fill="#534AB7" font-size="12">
    <text x="44" y="262">VBUS (TP11)</text>
    <text x="44" y="294">GPIO38 data (TP19)</text>
    <text x="44" y="322">GPIO39 clock (TP20)</text>
  </g>

  <!-- Signal path -->
  <g fill="#E1F5EE" stroke="#0F6E56">
    <rect x="290" y="268" width="170" height="70" rx="8"/>
    <rect x="490" y="268" width="80" height="70" rx="8"/>
    <rect x="600" y="258" width="140" height="90" rx="8"/>
  </g>
  <g fill="#085041" font-size="14" font-weight="600" text-anchor="middle">
    <text x="375" y="292">74AHCT125</text>
    <text x="530" y="300">33 Ω</text>
    <text x="670" y="284">Strand in</text>
  </g>
  <g fill="#0F6E56" font-size="12" text-anchor="middle">
    <text x="375" y="311">3.3 V to 5 V logic</text>
    <text x="375" y="327">powered from 5 V</text>
    <text x="530" y="319">× 2</text>
    <text x="670" y="304">Hilt end of Line 0</text>
    <text x="670" y="322">DATA, CLOCK</text>
  </g>
  <g stroke="#0F6E56" stroke-width="2" fill="none">
    <line x1="230" y1="290" x2="286" y2="290" marker-end="url(#as)"/>
    <line x1="230" y1="318" x2="286" y2="318" marker-end="url(#as)"/>
    <line x1="460" y1="290" x2="486" y2="290" marker-end="url(#as)"/>
    <line x1="460" y1="318" x2="486" y2="318" marker-end="url(#as)"/>
    <line x1="570" y1="290" x2="596" y2="290" marker-end="url(#as)"/>
    <line x1="570" y1="318" x2="596" y2="318" marker-end="url(#as)"/>
  </g>

  <!-- Ground -->
  <rect x="30" y="370" width="710" height="36" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="385" y="393" fill="#444441" font-size="13" text-anchor="middle">One common ground: battery, board, level shifter and every Line</text>
</svg>
