; Kalman Dong firmware. See README.md for how to build, test and flash.
; Toolchain choice: docs/adr/0004-pioarduino-platform.md

[platformio]
default_envs = xiao

; ---------------------------------------------------------------------------
; Device builds (Seeed XIAO ESP32-S3 Plus + 1.14" display carrier).
; One env per Dong Profile; the profile is selected with -DDONG_PROFILE_*.
; ---------------------------------------------------------------------------
[device]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32_s3_plus
framework = arduino
monitor_speed = 921600
lib_deps =
    https://github.com/FastLED/FastLED.git#d7402f1294e4548d9f8317f76afad37afaddb237 ; 3.10.8
    https://github.com/Seeed-Studio/Seeed_GFX2.git#5737488810b9e4acfd01e9ad328a583fb3ea19fa
build_flags =
    -std=gnu++17
    -Wall
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; The display owns SPI2 (FSPI); keep FastLED's clocked LEDs on SPI3.
    -DFASTLED_ESP32_SPI_BUS=SPI3_HOST
build_unflags = -std=gnu++11
test_ignore = *

[env:xiao]
extends = device
build_flags = ${device.build_flags} -DDONG_PROFILE_PROTO

; Bare board on the bench: Blade drawn on the display, no LEDs needed.
[env:xiao_screen]
extends = device
build_flags = ${device.build_flags} -DDONG_PROFILE_SCREEN -DKD_SCREEN_BLADE

[env:xiao_2m]
extends = device
build_flags = ${device.build_flags} -DDONG_PROFILE_2M

[env:xiao_lightswarm]
extends = device
build_flags = ${device.build_flags} -DDONG_PROFILE_LIGHTSWARM -DFASTLED_FORCE_SOFTWARE_SPI

; ---------------------------------------------------------------------------
; Host unit tests for the pure-C++ core (lib/core): pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = doctest
build_flags = -std=gnu++17 -Wall -Wextra -Werror
build_unflags = -std=gnu++11
